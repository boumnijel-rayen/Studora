name: studora
description: "Studora — application mobile d'organisation et de suivi des études (prototype frontend)."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.8.1

# ⚠️ Toute nouvelle dépendance doit être validée par le lead (Membre 1).
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  fl_chart: 0.70.0
  flutter_riverpod: ^3.3.2
  go_router: ^17.0.0
  intl: ^0.20.2
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
